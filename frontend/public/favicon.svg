<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Gradients matching the site theme -->
    <linearGradient id="walletGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    
    <!-- Shadow for premium look -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Premium rounded squircle app background -->
  <rect width="460" height="460" x="26" y="26" rx="100" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.06)" stroke-width="2" filter="url(#shadow)" />

  <!-- Budget progress indicator arc -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="16" />
  <path d="M 256,76 A 180,180 0 1,1 120,374" fill="none" stroke="url(#walletGrad)" stroke-width="16" stroke-linecap="round" opacity="0.8" />
  
  <!-- Credit Card/Receipt sticking out -->
  <rect width="185" height="125" x="190" y="160" rx="18" fill="url(#cardGrad)" transform="rotate(-15 280 220)" opacity="0.95" />
  <rect width="40" height="30" x="210" y="195" rx="6" fill="rgba(255, 255, 255, 0.22)" transform="rotate(-15 280 220)" />

  <!-- Main Wallet Body -->
  <path d="M 120,220 C 120,200 136,184 156,184 L 356,184 C 376,184 392,200 392,220 L 392,340 C 392,360 376,376 356,376 L 156,376 C 136,376 120,360 120,340 Z" fill="url(#walletGrad)" />
  
  <!-- Wallet Flap partition -->
  <path d="M 120,252 L 392,252" stroke="rgba(0, 0, 0, 0.18)" stroke-width="6" />

  <!-- Lock Clasp -->
  <path d="M 330,230 C 330,220 340,210 355,210 L 392,210 L 392,290 L 355,290 C 340,290 330,280 330,270 Z" fill="#0b0f19" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2" />
  <circle cx="355" cy="250" r="10" fill="url(#cardGrad)" />

  <!-- Success/Savings Indicator Coin -->
  <circle cx="340" cy="330" r="52" fill="url(#coinGrad)" stroke="#090d16" stroke-width="12" />
  <!-- Growth/Sync Arrow -->
  <path d="M 340,306 L 340,354 M 320,326 L 340,306 L 360,326" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
</svg>