<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Flat Minimalist Trust Blue Favicon -->
  <!-- Rounded flat background -->
  <rect width="464" height="464" x="24" y="24" rx="80" fill="#0f172a" stroke="#334155" stroke-width="6" />

  <!-- Budget progress indicator arc in Trust Blue -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#1e293b" stroke-width="16" />
  <path d="M 256,76 A 180,180 0 1,1 120,374" fill="none" stroke="#2563eb" stroke-width="16" stroke-linecap="round" />
  
  <!-- Credit Card/Receipt sticking out in Dark Trust Blue -->
  <rect width="185" height="125" x="190" y="160" rx="14" fill="#1d4ed8" transform="rotate(-15 280 220)" />
  <rect width="40" height="30" x="210" y="195" rx="4" fill="#60a5fa" transform="rotate(-15 280 220)" opacity="0.8" />

  <!-- Main Wallet Body in Trust Blue -->
  <path d="M 120,220 C 120,200 136,184 156,184 L 356,184 C 376,184 392,200 392,220 L 392,340 C 392,360 376,376 356,376 L 156,376 C 136,376 120,360 120,340 Z" fill="#2563eb" />
  
  <!-- Wallet Flap partition -->
  <path d="M 120,252 L 392,252" stroke="#1d4ed8" stroke-width="5" />

  <!-- Lock Clasp -->
  <path d="M 330,230 C 330,220 340,210 355,210 L 392,210 L 392,290 L 355,290 C 340,290 330,280 330,270 Z" fill="#0f172a" stroke="#334155" stroke-width="2" />
  <circle cx="355" cy="250" r="10" fill="#60a5fa" />

  <!-- Flat Emerald Coin -->
  <circle cx="340" cy="330" r="52" fill="#10b981" stroke="#0f172a" stroke-width="10" />
  <!-- Growth/Sync Arrow -->
  <path d="M 340,306 L 340,354 M 320,326 L 340,306 L 360,326" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
</svg>